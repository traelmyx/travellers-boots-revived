modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/traelmyx/travellers-boots-revived/issues"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "traelmyx, DenisMasterHerobrine"
${logo_key} = "assets/travellersbootsreloaded/icon.png"
description = '''Five pairs of boots that make you faster, jump higher and step up full blocks. Based on Traveller's Boots: Reloaded by DenisMasterHerobrine.'''

[[dependencies.${id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_major},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${mc_dep}"
ordering = "NONE"
side = "BOTH"
